- name: homelab_stack | sabnzbd | Create config directory
  ansible.builtin.file:
    path: "{{ homelab_config_dir }}/sabnzbd"
    state: directory
    owner: "{{ main_usr }}"
    group: "{{ media_admin_group }}"
    mode: "2770"

- name: homelab_stack | sabnzbd | Create compose directory
  ansible.builtin.file:
    path: "{{ homelab_compose_dir }}/sabnzbd"
    state: directory
    owner: "{{ main_usr }}"
    group: "{{ usr_group }}"
    mode: "0750"

- name: homelab_stack | sabnzbd | Create Usenet download directories
  ansible.builtin.file:
    path: "{{ media_cached }}/{{ item }}"
    state: directory
    owner: "{{ main_usr }}"
    group: "{{ media_admin_group }}"
    mode: "2770"
  loop:
    - downloads
    - downloads/usenet
    - downloads/usenet/incomplete
    - downloads/usenet/complete
    - downloads/usenet/complete/movies
    - downloads/usenet/complete/tv

- name: homelab_stack | sabnzbd | Deploy Docker Compose template
  ansible.builtin.template:
    src: sabnzbd/docker-compose.yml.j2
    dest: "{{ homelab_compose_dir }}/sabnzbd/docker-compose.yml"
    owner: "{{ main_usr }}"
    group: "{{ usr_group }}"
    mode: "0640"
  register: sabnzbd_compose_template

- name: homelab_stack | sabnzbd | Deploy SABnzbd
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_compose_dir }}/sabnzbd"
    state: present
    pull: missing
    remove_orphans: true

- name: homelab_stack | sabnzbd | Wait for configuration file
  ansible.builtin.wait_for:
    path: "{{ homelab_config_dir }}/sabnzbd/sabnzbd.ini"
    state: present
    timeout: 30

- name: homelab_stack | sabnzbd | Configure allowed hostnames
  community.general.ini_file:
    path: "{{ homelab_config_dir }}/sabnzbd/sabnzbd.ini"
    section: misc
    option: host_whitelist
    value: "sabnzbd.{{ homelab_domain }},sabnzbd"
    no_extra_spaces: true
    owner: "{{ main_usr }}"
    group: "{{ media_admin_group }}"
    mode: "0660"
  register: sabnzbd_host_whitelist

- name: homelab_stack | sabnzbd | Restart after hostname configuration
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_compose_dir }}/sabnzbd"
    state: restarted
  when: sabnzbd_host_whitelist.changed
- name: homelab_stack | jellyfin | Ensure jellyfin user exists
  ansible.builtin.user:
    name: jellyfin
    groups:
      - "{{ media_read_group }}"
    append: true
    create_home: false
    shell: /sbin/nologin
    system: true
  become: true

- name: homelab_stack | jellyfin | Get jellyfin UID
  ansible.builtin.command:
    cmd: "id -u jellyfin"
  register: jellyfin_uid_cmd
  changed_when: false

- name: homelab_stack | jellyfin | Get jellyfin GID
  ansible.builtin.command:
    cmd: "id -g jellyfin"
  register: jellyfin_gid_cmd
  changed_when: false

- name: homelab_stack | jellyfin | Get media-read group
  ansible.builtin.command:
    cmd: "getent group {{ media_read_group }}"
  register: jellyfin_media_read_group_cmd
  changed_when: false

- name: homelab_stack | jellyfin | Set media-read GID
  ansible.builtin.set_fact:
    jellyfin_media_read_gid: "{{ jellyfin_media_read_group_cmd.stdout.split(':')[2] }}"

- name: homelab_stack | jellyfin | Create config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: jellyfin
    group: "{{ media_read_group }}"
    mode: "0775"
  loop:
    - "{{ homelab_config_dir }}/jellyfin"
    - "{{ homelab_config_dir }}/jellyfin/config"
    - "{{ homelab_config_dir }}/jellyfin/cache"

- name: homelab_stack | jellyfin | Ensure config permissions
  ansible.builtin.file:
    path: "{{ homelab_config_dir }}/jellyfin"
    state: directory
    owner: jellyfin
    group: "{{ media_read_group }}"
    mode: "0775"
    recurse: true

- name: homelab_stack | jellyfin | Create compose directory
  ansible.builtin.file:
    path: "{{ homelab_compose_dir }}/jellyfin"
    state: directory
    owner: "{{ nas_user }}"
    group: "{{ nas_group }}"
    mode: "0755"

- name: homelab_stack | jellyfin | Deploy compose file
  ansible.builtin.template:
    src: jellyfin/docker-compose.yml.j2
    dest: "{{ homelab_compose_dir }}/jellyfin/docker-compose.yml"
    owner: "{{ nas_user }}"
    group: "{{ nas_group }}"
    mode: "0644"

- name: homelab_stack | jellyfin | Start stack
  community.docker.docker_compose_v2:
    project_src: "{{ homelab_compose_dir }}/jellyfin"
    pull: always
    state: present

- name: homelab_stack | jellyfin | Wait for API
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -fsS http://jellyfin:8096/System/Info/Public
  register: jellyfin_api_ready
  retries: 30
  delay: 2
  until: jellyfin_api_ready.rc == 0
  changed_when: false

- name: homelab_stack | jellyfin | Check startup state
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -s -o /dev/null -w "%{http_code}"
      http://jellyfin:8096/Startup/Configuration
  register: jellyfin_startup_config
  changed_when: false
  failed_when: false

- name: homelab_stack | jellyfin | Set startup configuration
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -fsS -X POST
      -H "Content-Type: application/json"
      -d '{"UICulture":"{{ jellyfin_ui_culture }}","MetadataCountryCode":"{{ jellyfin_metadata_country }}","PreferredMetadataLanguage":"{{ jellyfin_metadata_language }}","ServerName":"{{ jellyfin_server_name }}"}'
      http://jellyfin:8096/Startup/Configuration
  when: jellyfin_startup_config.stdout == "200"

- name: homelab_stack | jellyfin | Create initial admin user
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -fsS -X POST
      -H "Content-Type: application/json"
      -d '{"Name":"{{ jellyfin_admin_user }}","Password":"{{ jellyfin_admin_password }}"}'
      http://jellyfin:8096/Startup/User
  when: jellyfin_startup_config.stdout == "200"
  no_log: true

- name: homelab_stack | jellyfin | Configure remote access
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -fsS -X POST
      -H "Content-Type: application/json"
      -d '{"EnableRemoteAccess":{{ jellyfin_enable_remote_access | default(false) | lower }},"EnableAutomaticPortMapping":{{ jellyfin_enable_automatic_port_mapping | default(false) | lower }}}'
      http://jellyfin:8096/Startup/RemoteAccess
  when: jellyfin_startup_config.stdout == "200"

- name: homelab_stack | jellyfin | Complete startup wizard
  ansible.builtin.command:
    cmd: >
      docker run --rm
      --network {{ docker_network_name }}
      curlimages/curl:latest
      -fsS -X POST
      http://jellyfin:8096/Startup/Complete
  when: jellyfin_startup_config.stdout == "200"
- include_vars: "ports.yml"
  tags: always

- name: homelab | dashboard
  block:

    - import_tasks: "core/main.yml"
      tags: homelab_core

    - import_tasks: "monitoring/main.yml"
      tags: homelab_monitoring

    - import_tasks: 'media/main.yml'
      tags: homelab_media

  when: ansible_facts.os_family == "Debian"
  become: true
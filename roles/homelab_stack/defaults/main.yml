homelab_base_dir: /opt/docker
homelab_config_dir: "{{ homelab_base_dir }}/config"
homelab_compose_dir: "{{ homelab_base_dir }}/compose"

glance_services:
  core:
    - name: Portainer
      icon: si:portainer
      url: "https://portainer.{{ homelab_domain }}"

    - name: Vaultwarden
      icon: si:vaultwarden
      url: "https://vaultwarden.{{ homelab_domain}}"

    - name: File Browser
      icon: di:filebrowser
      url: "https://filebrowser.{{ homelab_domain }}"

    - name: Adguard
      icon: si:adguard
      url: "https://adguard.{{ homelab_domain }}"

  media:
    - name: Jellyfin
      icon: si:jellyfin
      url: "https://jellyfin.{{ homelab_domain }}"

    - name: Seerr
      icon: sh:overseerr
      url: "https://seerr.{{ homelab_domain }}"

    - name: Sonarr
      icon: si:sonarr
      url: "https://sonarr.{{ homelab_domain }}"

    - name: Radarr
      icon: si:radarr
      url: "https://radarr.{{ homelab_domain }}"

    - name: Prowlarr
      icon: di:prowlarr
      url: "https://prowlarr.{{ homelab_domain }}"

    - name: qBittorrent
      icon: si:qbittorrent
      url: "https://qbittorrent.{{ homelab_domain }}"

  monitoring:
    - name: Grafana
      icon: si:grafana
      url: "https://grafana.{{ homelab_domain }}"

    - name: Prometheus
      icon: si:prometheus
      url: "https://prometheus.{{ homelab_domain }}"

    - name: Scrutiny
      icon: sh:scrutiny
      url: "https://scrutiny.{{ homelab_domain }}"
vaultwarden_signups_allowed: "true"
vaultwarden_invitations_allowed: "false"
vaultwarden_websocket_enabled: "true"
vaultwarden_domain: "http://{{ ansible_host }}:{{ Vaultwarden }}"

vaultwarden_admin_token: "{{ lookup('password', 'credentials/vaultwarden_admin_token length=64 chars=ascii_letters,digits') }}"